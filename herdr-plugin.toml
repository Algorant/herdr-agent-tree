id = "agent-tree"
name = "Agent Tree"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Shows Pi Subagents and Workers beneath their immediate delegating agent in the native Agents sidebar"
platforms = ["linux"]

[[build]]
command = ["cargo", "build", "--locked", "--release"]

[[startup]]
command = ["./src/agent-tree", "start"]

[[actions]]
id = "apply"
title = "Apply the Pi delegation tree projection"
command = ["./src/agent-tree", "apply"]

[[actions]]
id = "reload"
title = "Replace the running subscriber with this build and re-apply the tree projection"
command = ["./src/agent-tree", "reload"]

[[actions]]
id = "clear"
title = "Clear Agent Tree decorations and view"
command = ["./src/agent-tree", "clear"]

[[actions]]
id = "toggle"
title = "Toggle Agent Tree ordering on or off"
command = ["./src/agent-tree", "toggle"]
