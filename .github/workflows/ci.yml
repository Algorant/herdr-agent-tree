name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component rustfmt,clippy
          rustup default 1.81.0
      - name: Build locked source
        run: cargo build --locked
      - name: Run the hermetic quality gate (format, Clippy, tests, build, shell, source-install and local-stage suites)
        run: scripts/check.sh --no-e2e
