name: Publish tagged release

on:
  push:
    tags:
      - 'v*'

# Herdr installs the plugin from this tagged source revision and runs the manifest build
# itself, so the release is the immutable source tree. Publication creates no binary assets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          rustup default 1.81.0
      - name: Require exact manifest/Cargo/changelog/tag agreement and the locked source build
        run: scripts/release/check-release.sh --ref "$GITHUB_REF"
      - name: Prove a clean source checkout builds the executable Herdr runs
        run: tests/shell/source-install.sh

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Create immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_EVENT_NAME" = push
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'release already exists; refusing replacement' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
