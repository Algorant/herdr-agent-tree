name: Publish tagged release

on:
  push:
    tags:
      - 'v*'

# Builds cannot write repository content. Only the final publication job can.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      epoch: ${{ steps.epoch.outputs.epoch }}
      targets: ${{ steps.targets.outputs.targets }}
      target-count: ${{ steps.targets.outputs.target-count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Require exact manifest/Cargo/changelog/tag agreement
        id: version
        run: |
          scripts/check-release.sh --ref "$GITHUB_REF"
          version=$(awk -F '"' '$1 ~ /^[[:space:]]*version[[:space:]]*=/ { print $2; exit }' herdr-plugin.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require a committed project LICENSE
        run: test -f LICENSE && test ! -L LICENSE
      - name: Require owner-approved targets with tracked native evidence
        id: targets
        run: |
          git ls-files --error-unmatch release-targets.txt >/dev/null
          scripts/check-release-targets.sh >approved-targets.txt
          while IFS= read -r target; do
            scripts/check-release-targets.sh --target "$target"
          done <approved-targets.txt
          targets=$(jq -Rsc 'split("\n") | map(select(length > 0))' approved-targets.txt)
          printf 'targets=%s\n' "$targets" >> "$GITHUB_OUTPUT"
          printf 'target-count=%s\n' "$(wc -l <approved-targets.txt)" >> "$GITHUB_OUTPUT"
      - name: Freeze release commit epoch
        id: epoch
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.gate.outputs.targets) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install exact Rust release target
        run: rustup toolchain install 1.81.0 --profile minimal --target '${{ matrix.target }}'
      - name: Build locked final binary set
        run: cargo +1.81.0 build --locked --release --target '${{ matrix.target }}' --bins
      - name: Package owner-gated final asset
        env:
          SOURCE_DATE_EPOCH: ${{ needs.gate.outputs.epoch }}
        run: scripts/package-release.sh --mode final --promotion release-targets.txt --target '${{ matrix.target }}' --binary-dir 'target/${{ matrix.target }}/release' --output target/release-assets
      - name: Assert final ELF machine, static linkage, and exact archive
        run: |
          scripts/check-target-binaries.sh --target '${{ matrix.target }}' --binary-dir 'target/${{ matrix.target }}/release'
          tar -tvzf 'target/release-assets/agent-tree-v${{ needs.gate.outputs.version }}-${{ matrix.target }}.tar.gz'
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: release-${{ github.run_id }}-${{ matrix.target }}
          path: |
            target/release-assets/*.tar.gz
            target/release-assets/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: release-${{ github.run_id }}-*
          path: target/release-assets
          merge-multiple: true
      - name: Reject mixed or incomplete build outputs
        run: |
          count='${{ needs.gate.outputs.target-count }}'
          test "$(find target/release-assets -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq "$count"
          test "$(find target/release-assets -maxdepth 1 -type f -name '*.tar.gz.sha256' | wc -l)" -eq "$count"
          test "$(find target/release-assets -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq "$((count * 2))"
          test "$(find target/release-assets -mindepth 1 -maxdepth 1 -type l | wc -l)" -eq 0
          for archive in target/release-assets/*.tar.gz; do
            target=${archive%.tar.gz}; target=${target##*-v${{ needs.gate.outputs.version }}-}
            scripts/check-release-targets.sh --target "$target"
          done
          scripts/write-checksums.sh target/release-assets --targets-file release-targets.txt
          scripts/check-release.sh --ref "$GITHUB_REF" --assets target/release-assets --targets-file release-targets.txt
      - name: Create immutable tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_EVENT_NAME" = push
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'release already exists; refusing replacement' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes target/release-assets/*
