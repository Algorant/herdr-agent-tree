# Both release targets use rust-lld and Rust's bundled musl startup objects.
# This avoids an unpinned downloaded cross compiler and keeps the strategy identical
# on developer hosts and GitHub-hosted x86-64 runners.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]
